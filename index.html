<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>وردي — من فاطر إلى البقرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#FBF7EC;
    --parchment-deep:#F3ECDC;
    --ink:#2A2118;
    --ink-soft:#5B4E3F;
    --green:#1F4B3F;
    --green-deep:#153730;
    --gold:#B98B4E;
    --gold-soft:#E7D3AC;
    --done-bg:#E4EFE6;
    --line:#E4DAC5;
    --shadow: 0 2px 14px rgba(42,33,24,0.06);
    --ease: cubic-bezier(.4,0,.2,1);
    --ease-bounce: cubic-bezier(.34,1.56,.64,1);
  }
  html{scroll-behavior:smooth;}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; outline:none;}
  .check, .surah-head, .day-row{-webkit-user-select:none; user-select:none;}
  .check:focus, .check:focus-visible, .surah-head:focus, button:focus{outline:none; box-shadow:none;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding-bottom:80px;
  }
  /* subtle geometric texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(185,139,78,0.05) 0, transparent 45%),
      radial-gradient(circle at 90% 92%, rgba(31,75,63,0.05) 0, transparent 45%);
    pointer-events:none; z-index:0;
  }

  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--green-deep), var(--green));
    color:#F6EFDE;
    padding:22px 18px 18px;
    border-bottom:3px solid var(--gold);
    box-shadow:var(--shadow);
  }
  .title-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  h1{
    font-family:'Amiri', serif;
    font-size:26px; font-weight:700;
    letter-spacing:0.5px;
  }
  .subtitle{
    font-size:12.5px; color:var(--gold-soft); font-weight:400; margin-top:2px;
  }
  .today-pill{
    font-size:11.5px; background:rgba(246,239,222,0.1);
    border:1px solid rgba(246,239,222,0.25);
    border-radius:20px; padding:5px 11px; white-space:nowrap;
    text-align:center; line-height:1.5;
  }
  .today-pill b{display:block; font-size:12.5px;}

  .progress-wrap{margin-top:16px;}
  .progress-labels{display:flex; justify-content:space-between; font-size:12px; color:var(--gold-soft); margin-bottom:6px;}
  .progress-labels b{color:#fff; font-weight:700;}
  .bar-track{
    height:10px; border-radius:6px; background:rgba(246,239,222,0.15); overflow:hidden;
    position:relative;
  }
  .bar-fill{
    height:100%; border-radius:6px;
    background:linear-gradient(90deg, var(--gold), #D9B378);
    transition:width .8s var(--ease);
  }

  main{max-width:640px; margin:0 auto; padding:18px 14px; position:relative; z-index:1;}

  /* Tasbih rail */
  .rail{
    position:absolute; top:18px; bottom:18px; right:6px; width:2px;
    background:repeating-linear-gradient(180deg, var(--line) 0 6px, transparent 6px 12px);
    z-index:0; display:none;
  }
  @media(min-width:520px){ .rail{display:block;} main{padding-right:26px;} }

  .surah-section{
    margin-bottom:14px; border-radius:14px; overflow:hidden;
    background:#fff; box-shadow:var(--shadow); border:1px solid var(--line);
    opacity:0; transform:translateY(10px);
    animation:riseIn .5s var(--ease) forwards;
  }
  @keyframes riseIn{ to{opacity:1; transform:translateY(0);} }
  .surah-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; cursor:pointer; user-select:none;
    background:var(--parchment-deep);
    transition:background .25s var(--ease), transform .15s var(--ease);
  }
  .surah-head:active{background:var(--gold-soft); transform:scale(.99);}
  .surah-head-l{display:flex; align-items:center; gap:10px; min-width:0;}
  .bead{
    width:13px; height:13px; border-radius:50%; flex:none;
    border:2px solid var(--gold); background:#fff;
    transition:background .4s var(--ease), border-color .4s var(--ease), transform .4s var(--ease-bounce);
  }
  .bead.full{background:var(--gold); border-color:var(--gold); transform:scale(1.15);}
  .surah-name{font-family:'Amiri', serif; font-weight:700; font-size:19px; color:var(--green-deep);}
  .surah-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .surah-head-r{display:flex; align-items:center; gap:8px; flex:none;}
  .surah-progress-txt{font-size:11.5px; color:var(--ink-soft); font-weight:700;}
  .chev{
    width:9px; height:9px; border-right:2px solid var(--ink-soft); border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg); transition:transform .35s var(--ease); flex:none;
  }
  .surah-section.open .chev{transform:rotate(-135deg);}

  .days{max-height:0; opacity:0; overflow:hidden; transition:max-height .45s var(--ease), opacity .35s var(--ease);}
  .surah-section.open .days{max-height:6000px; opacity:1;}

  .day-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; border-top:1px solid var(--line);
    transition:background .3s var(--ease);
  }
  .day-row.done{background:var(--done-bg);}
  .day-row:active{background:var(--parchment-deep);}
  .check{
    width:24px; height:24px; border-radius:7px; border:2px solid var(--green);
    flex:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .25s var(--ease), border-color .25s var(--ease), transform .3s var(--ease-bounce);
  }
  .check:active{transform:scale(.85);}
  .check.on{background:var(--green); animation:pop .35s var(--ease-bounce);}
  @keyframes pop{ 0%{transform:scale(.7);} 60%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .check svg{width:14px; height:14px; opacity:0; transition:opacity .2s var(--ease) .05s;}
  .check.on svg{opacity:1;}
  .day-info{flex:1; min-width:0;}
  .day-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:2px;}
  .day-num{font-size:11px; color:#fff; background:var(--green); border-radius:5px; padding:1px 7px; font-weight:700;}
  .weekday-tag{font-size:11px; font-weight:700; color:var(--green); background:var(--done-bg); border-radius:6px; padding:2px 8px;}
  .day-dates{font-size:12px; color:var(--ink-soft); line-height:1.5;}
  .day-dates .hijri{color:var(--ink); font-weight:700; display:block;}
  .day-dates .greg{display:block; font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .day-range{font-size:14px; margin-top:3px;}
  .day-range b{color:var(--green-deep); font-weight:700;}
  .day-pages{
    font-size:10.5px; color:var(--gold); font-weight:700; flex:none;
    background:#fbf2e3; border:1px solid var(--gold-soft); border-radius:8px; padding:4px 7px; text-align:center;
    max-width:88px; line-height:1.4;
  }
  .day-row.today{
    outline:2px solid var(--gold); outline-offset:-2px;
  }
  .day-row.locked{background:#F0EAD9;}
  .check.locked{cursor:default; opacity:.85;}
  .locked-tag{background:var(--gold-soft); color:var(--ink-soft);}

  footer.note{
    max-width:640px; margin:20px auto 0; padding:14px 18px; font-size:11.5px;
    color:var(--ink-soft); text-align:center; line-height:1.9;
  }
</style>
</head>
<body>

<header class="top">
  <div class="title-row">
    <div>
      <h1>وردي اليومي</h1>
      <div class="subtitle">من سورة فاطر إلى سورة البقرة</div>
    </div>
    <div class="today-pill"><span id="todayLabel">اليوم</span><b id="todayDate">—</b><span id="todayGreg" style="font-size:10.5px; opacity:.8;"></span></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-labels"><span>التقدّم</span><b id="progressTxt">٠ من ٤٣٩ صفحة</b></div>
    <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  </div>
</header>

<main>
  <div class="rail"></div>
  <div id="sections"></div>
</main>

<footer class="note">
  التواريخ الهجرية محسوبة تقويميًا وقد تختلف يوم عن رؤية الهلال الرسمية · مصحف المدينة النبوية ٦٠٤ صفحة
</footer>

const TOTAL_PAGES = 604; // كامل صفحات المصحف
// محفوظ سابقًا (غير ظاهر بالجدول لأنه قبل يس): من يس إلى الناس (440-604) = 165 صفحة
const ALREADY_DONE_PAGES = 165;

const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicDigits(n){ return String(n).replace(/[0-9]/g, d => AR_DIGITS[d]); }

let doneSet = new Set(DATA.filter(d=>d.done).map(d=>d.day));

async function loadProgress(){
  try{
    const raw = localStorage.getItem('wird-progress');
    if(raw){
      const arr = JSON.parse(raw);
      arr.forEach(d => doneSet.add(d));
    }
  }catch(e){ /* no saved progress yet, or storage unavailable */ }
}
async function saveProgress(){
  try{
    localStorage.setItem('wird-progress', JSON.stringify(Array.from(doneSet)));
  }catch(e){ console.error('storage save failed', e); }
}

function groupBySurah(){
  const groups = [];
  let current = null;
  DATA.forEach(row=>{
    if(!current || current.surahNum !== row.surahNum){
      current = {surahNum: row.surahNum, surahName: row.surahName, rows: []};
      groups.push(current);
    }
    current.rows.push(row);
  });
  return groups;
}

let isFirstRender = true;
let openSurahs = null; // Set of surahNum currently open, persists across re-renders

function render(){
  function localDateStr(dt){
    const y = dt.getFullYear();
    const m = String(dt.getMonth()+1).padStart(2,'0');
    const d = String(dt.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const todayStr = localDateStr(new Date());
  const todayRow = DATA.find(d=>d.greg === todayStr);
  const now = new Date();
  const weekdayArNow = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][now.getDay()];
  document.getElementById('todayLabel').textContent = `اليوم ${weekdayArNow}`;
  document.getElementById('todayDate').textContent = todayRow ? todayRow.hijri : '—';
  document.getElementById('todayGreg').textContent = todayStr;

  const presetDoneWeight = DATA.filter(d=>d.done).reduce((s,d)=>s+d.weight,0);
  const checkedWeight = DATA.filter(d=>doneSet.has(d.day) && !d.done).reduce((s,d)=>s+d.weight,0);
  const donePagesExact = ALREADY_DONE_PAGES + presetDoneWeight + checkedWeight;
  const pct = Math.min(100, (donePagesExact/TOTAL_PAGES)*100);
  document.getElementById('barFill').style.width = pct+'%';
  function toArabicNumber(n){
    const rounded = Math.round(n*2)/2; // nearest .5
    const isHalf = Math.abs(rounded - Math.trunc(rounded)) === 0.5;
    const whole = Math.trunc(rounded);
    return isHalf ? `${toArabicDigits(whole)}٫٥` : toArabicDigits(whole);
  }
  document.getElementById('progressTxt').textContent = `${toArabicNumber(donePagesExact)} من ${toArabicDigits(TOTAL_PAGES)} صفحة`;

  const groups = groupBySurah();
  const container = document.getElementById('sections');
  container.innerHTML = '';

  if(openSurahs === null){
    openSurahs = new Set();
    groups.forEach((g, gi)=>{
      const containsToday = g.rows.some(r=>r.greg===todayStr);
      if(containsToday || gi===0) openSurahs.add(g.surahNum);
    });
  }

  groups.forEach((g, gi)=>{
    const total = g.rows.length;
    const doneCount = g.rows.filter(r=>doneSet.has(r.day)).length;
    const isFull = doneCount === total;
    const isOpen = openSurahs.has(g.surahNum);
    const firstPage = g.rows[0].pages.split('-')[0].split('..')[0];
    const lastRowPages = g.rows[g.rows.length-1].pages;
    const lastPage = lastRowPages.includes('..') ? lastRowPages.split('..')[1] : lastRowPages.split('-').pop();

    const section = document.createElement('div');
    section.className = 'surah-section' + (isOpen ? ' open' : '');
    if(isFirstRender){
      section.style.animationDelay = (gi*0.04)+'s';
    }else{
      section.style.animation = 'none';
      section.style.opacity = '1';
      section.style.transform = 'none';
    }
    section.innerHTML = `
      <div class="surah-head">
        <div class="surah-head-l">
          <div class="bead ${isFull?'full':''}"></div>
          <div>
            <div class="surah-name">سورة ${g.surahName}</div>
            <div class="surah-meta">صفحات ${toArabicDigits(firstPage)}–${toArabicDigits(lastPage)}</div>
          </div>
        </div>
        <div class="surah-head-r">
          <span class="surah-progress-txt">${toArabicDigits(doneCount)}/${toArabicDigits(total)}</span>
          <span class="chev"></span>
        </div>
      </div>
      <div class="days"></div>
    `;
    const daysEl = section.querySelector('.days');
    g.rows.forEach(row=>{
      const isDone = doneSet.has(row.day);
      const isToday = row.greg === todayStr;
      const isLocked = row.done === true; // pre-tracker historical entry
      const dayEl = document.createElement('div');
      dayEl.className = 'day-row' + (isDone?' done':'') + (isToday?' today':'') + (isLocked?' locked':'');
      const checkInner = isLocked
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      dayEl.innerHTML = `
        <div class="check ${isDone?'on':''} ${isLocked?'locked':''}" data-day="${row.day}" ${isLocked?'data-locked="1"':''}>
          ${checkInner}
        </div>
        <div class="day-info">
          <div class="day-top">
            ${isLocked ? '<span class="weekday-tag locked-tag">قبل الجدول</span>' : `<span class="day-num">${toArabicDigits(row.day)}</span><span class="weekday-tag">${row.weekday}</span><span class="day-dates"><span class="hijri">${row.hijri}</span><span class="greg">${row.greg}</span></span>`}
          </div>
          <div class="day-range"><b>${row.from}</b> ← ${row.to}</div>
        </div>
        <div class="day-pages">ص ${toArabicDigits(row.pages)}</div>
      `;
      daysEl.appendChild(dayEl);
    });

    section.querySelector('.surah-head').addEventListener('click', ()=>{
      if(openSurahs.has(g.surahNum)) openSurahs.delete(g.surahNum);
      else openSurahs.add(g.surahNum);
      section.classList.toggle('open');
    });

    container.appendChild(section);
  });

  // checkbox handlers
  container.querySelectorAll('.check').forEach(el=>{
    if(el.dataset.locked) return; // historical entries can't be unchecked
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const day = parseInt(el.dataset.day);
      if(doneSet.has(day)) doneSet.delete(day); else doneSet.add(day);
      await saveProgress();
      render();
    });
  });

  isFirstRender = false;
}

(async function init(){
  await loadProgress();
  render();
})();
</script>
